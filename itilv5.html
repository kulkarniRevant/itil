<html lang="en">
<head>

<title>ITIL V5 Foundation — 78 Question Quiz</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --text:#142033; --muted:#637083;
  --primary:#0879e8; --primary2:#065fc1; --border:#dce4ee;
  --good:#15803d; --goodbg:#ecfdf3; --bad:#b91c1c; --badbg:#fef2f2;
}
* {box-sizing:border-box}
body {margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
header {position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px max(14px,env(safe-area-inset-left))}
.top {max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1 {font-size:17px;margin:0}
.stat {font-size:13px;color:var(--muted);white-space:nowrap}
main {max-width:850px;margin:0 auto;padding:18px 14px 100px}
.progress {height:8px;background:#e7edf5;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.progress > div {height:100%;background:var(--primary);width:0%;transition:width .25s}
.card {background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(20,32,51,.05)}
.meta {font-size:12px;color:var(--muted);margin-bottom:8px}
.question {font-size:20px;font-weight:700;line-height:1.35;margin:0 0 18px}
.option {display:block;width:100%;text-align:left;border:1.5px solid var(--border);background:#fff;border-radius:13px;padding:14px 14px;margin:10px 0;font-size:16px;color:var(--text);cursor:pointer;transition:.15s}
.option:hover {border-color:#8bb9e9;background:#f8fbff}
.option:disabled {cursor:default}
.option.correct {border-color:var(--good);background:var(--goodbg)}
.option.wrong {border-color:var(--bad);background:var(--badbg)}
.letter {font-weight:800;display:inline-block;width:26px}
.feedback {margin-top:14px;padding:12px 14px;border-radius:12px;background:#f5f8fc;border:1px solid var(--border);font-size:14px}
.feedback.good {background:var(--goodbg);border-color:#b7e5c6;color:#166534}
.feedback.bad {background:var(--badbg);border-color:#fecaca;color:#991b1b}
.controls {display:flex;gap:10px;margin-top:18px}
button.control {flex:1;border:0;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:700;background:#e9eff7;color:var(--text);cursor:pointer}
button.primary {background:var(--primary);color:#fff}
button.primary:disabled, button.control:disabled {opacity:.45;cursor:not-allowed}
.tools {display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tool {border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
.summary {text-align:center;padding:25px 10px}
.score {font-size:48px;font-weight:800;color:var(--primary);margin:8px 0}
.small {font-size:14px;color:var(--muted)}
.navgrid {display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.navgrid button {padding:8px 0;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12px;cursor:pointer}
.navgrid button.done {background:#eef8f1;border-color:#a7d9b4;color:#166534}
.navgrid button.current {outline:2px solid var(--primary)}
@media(max-width:520px){
  main{padding:12px 10px 90px}
  .card{padding:15px;border-radius:15px}
  .question{font-size:18px}
  .option{font-size:15px;padding:13px}
  .navgrid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>

  <div id="navigator" class="navgrid" style="display:none"></div>

</main>

sly introduce new products into the operational environment", "To ensure continual alignment of the product roadmap with needs of service consumers", "To create prototypes and specifications for products and services", "To develop, integrate and test digital products"], "a": 0, "id": 24, "page": 2}, {"q": "Performing routine tasks such as backups, monitoring, and capturing and processing events is part of which of the following activities?", "o": ["Deliver", "Support", "Operate", "Transition"], "a": 2, "id": 25, "page": 3}, {"q": "Which of the following is a key success metric for 'Transition' activity?", "o": ["Speed of normal service restoration", "Quality of the resources and services outsourced from suppliers", "Service performance against the agreed SLA targets", "Number and impact of deployment errors"], "a": 3, "id": 26, "page": 3}, {"q": "Why is it important to seek feedback before, during, and after each iteration?", "o": ["To document all activities in detail before starting the next iteration", "To ensure the project plan remains fixed and unchanged throughout development", "To allow the team to follow the original design without interruption", "To ensure that each iteration is aligned with changing circumstances"], "a": 3, "id": 27, "page": 3}, {"q": "What is a value stream?", "o": ["A set of organizational resources and capabilities to achieve an objective", "A series of steps an organization undertakes to enable value for consumers through management of products and services", "A tangible or intangible deliverable of an activity", "A configuration of an organization's resources designed to offer value for a consumer"], "a": 1, "id": 28, "page": 3}, {"q": "Which BEST explains why an organization might choose to engage external suppliers?", "o": ["To maintain greater control and visibility over service delivery", "To minimize reliance on third-party providers", "To remove the need for oversight, governance, and internal management", "To obtain capabilities that are difficult to develop internally"], "a": 3, "id": 29, "page": 3}, {"q": "A healthcare IT provider is planning to launch a new digital appointment system. According to 'Focus on value', what should the organization do first?", "o": ["Understand why patients use the appointment service", "Identify who the service consumers and key stakeholders are", "Analyze how the system will help patients achieve their goals", "Evaluate the risks and financial consequences for the consumers"], "a": 0, "id": 30, "page": 3}, {"q": "What is a product prototype?", "o": ["A request that triggers an agreed service action", "The process of releasing new or updated products to users", "An initial version of a product demonstrating its basic form and functionality", "A finalized product specification approved for development"], "a": 2, "id": 31, "page": 3}, {"q": "An organization is planning to improve the existing service and wants to understand its current performance before making any changes. According to the principle 'Start where you are', what could an organization consider when observing current performance of the service?", "o": ["Involve people who have little or no prior knowledge of the service", "Select the right message and method to communicate with stakeholders", "Identify who the consumers are and why they use the service", "Avoid applying risk management when reusing existing processes"], "a": 2, "id": 32, "page": 3}, {"q": "Which value chain activity is assessed by evaluating the quality of the resources and services sourced from a third party?", "o": ["Build", "Design", "Acquire", "Discover"], "a": 2, "id": 33, "page": 3}, {"q": "A telecom provider designs an enterprise package that combines internet, VoIP, network security and technical support. Which concept does this illustrate?", "o": ["Transfer of goods", "Service action", "Access to resources", "Service offering"], "a": 3, "id": 34, "page": 3}, {"q": "Which of the following activities BEST represents transfer of goods in a service offering?", "o": ["A cloud user accesses shared online storage", "A service provider supplies new laptops to the customer", "A customer receives advice from a helpdesk agent", "A team attends a virtual training session"], "a": 1, "id": 35, "page": 3}, {"q": "Which activity focuses on securing and allocating necessary resources efficiently?", "o": ["Acquire", "Build", "Discover", "Deliver"], "a": 0, "id": 36, "page": 3}, {"q": "Which of the following terms BEST describes a change?", "o": ["An unplanned interruption to a service or reduction in the quality of a service", "The addition, modification or removal of anything that could have an effect on product and service", "Any component that needs to be managed in order to deliver an IT service", "An underlying cause of one or more incidents"], "a": 1, "id": 37, "page": 4}, {"q": "Which is an approach to software development in which software can be released to production at any time after a decision is made by the team?", "o": ["Continuous Deployment", "Continuous Integration", "Continuous Delivery", "DevOps"], "a": 2, "id": 38, "page": 4}, {"q": "Why is project management important in ITIL?", "o": ["To manage routine operational activities and service requests", "To define governance authority across the ITIL Value System", "To deliver time-bound initiatives that introduce new or changed services", "To enable structured delivery of change while services continue to operate"], "a": 2, "id": 39, "page": 4}, {"q": "What is the purpose of the ITIL AI Capability Model?", "o": ["To describe how service providers, service consumers, and other parties interact with AI to co-create value", "To describe how organizations can assess and develop capabilities for effective use of AI", "To prescribe specific AI technologies required for service development and management", "To measure the performance of AI-enabled services against predefined service levels"], "a": 1, "id": 40, "page": 4}, {"q": "Which B e the need for value streams", "They provide resources and capabilities to accomplish objectives", "They influence the financial outcome of the organization"], "a": 2, "id": 64, "page": 6}, {"q": "Which of the following is an example of access to resources?", "o": ["An employee attends a training session delivered by an instructor", "A technician performs on-site installation of equipment", "A supplier delivers new laptops to the customer's office", "A user is granted permission to use a cloud-based application"], "a": 3, "id": 65, "page": 6}, {"q": "What is a service request?", "o": ["A flaw or vulnerability in a product or system", "A user-initiated action that triggers an agreed service", "A cause of one or more service incidents", "A change of state significant for management"], "a": 1, "id": 66, "page": 6}, {"q": "What does the 'partners and suppliers' chapter of an ITIL Official Practice Guide provide?", "o": ["Dependencies on third parties", "Capability levels, criteria, and recommendations for self-assessment", "Purpose and description of the practice", "Key information, automation, and tooling for a practice"], "a": 1, "id": 67, "page": 6}, {"q": "When applying the 'collaborate and promote visibility' principle to an organization's initiative, which is NOT a necessary action?", "o": ["Ensuring everyone involved in the initiative agrees about it before initiating", "Making decisions about the initiative on visible data", "Considering different methods of communication for the different audiences", "Communicating information about the initiative to other parts of the organization"], "a": 0, "id": 68, "page": 6}, {"q": "Which lifecycle management activity is responsible for resolving incidents?", "o": ["Support", "Design", "Operate", "Transition"], "a": 0, "id": 69, "page": 6}, {"q": "What is Site Reliability Engineering (SRE)?", "o": ["Regularly merging code into a shared repository", "Applying a strategy to avoid sudden unplanned events that might cause organizational damage", "Evaluating how reliable a product is against its specifications", "Applying software engineering to infrastructure and operations problems"], "a": 3, "id": 70, "page": 6}, {"q": "Which dimension of product and service management focuses on implementing a system of rules, policies, and standards to manage data assets?", "o": ["Partners and suppliers", "Organizations and people", "Information and technology", "Value streams and processes"], "a": 2, "id": 71, "page": 6}, {"q": "How can continual improvement of value streams be achieved?", "o": ["By eliminating external dependencies altogether", "By creating new value streams for every product or service", "By improving the management practices that support and enable value streams", "By directly controlling variability in workflows"], "a": 2, "id": 72, "page": 6}, {"q": "How do ITIL Guiding Principles and continual improvement affect governance activities within the ITIL Value System (VS)?", "o": ["They are optional elements that organizations may choose to ignore without impacting governance", "They provide a framework for defining governance principles and ensure ongoing improvement aligns with stakeholder expectations", "They focus exclusively on financial performance and do not relate to governance oversight", "They apply only to management practices and do not influence governance activities"], "a": 1, "id": 73, "page": 7}, {"q": "Who is responsible for the procurement and use of services?", "o": ["Service provider", "Digital product vendor", "Service consumer", "Sponsor"], "a": 2, "id": 74, "page": 7}, {"q": "The purpose of the 'Build' activity is to:", "o": ["Align service offerings with organizational strategy", "Develop and integrate functional solutions", "Resolve incidents and ensure disaster recovery", "Provide services and manage user experience"], "a": 1, "id": 75, "page": 7}, {"q": "Which statement regarding the relationship between management practices and value chain activities is     const good = picked === q.a;
    html += `<div class="feedback ${good?'good':'bad'}">
      ${good ? "Correct." : "Not quite."} The source PDF marks <b>${String.fromCharCode(65+q.a)}</b> as the correct answer.
    </div>`;
  }
  html += `<div class="controls">
      <button class="control" id="prevBtn" ${pos===0?'disabled':''}>Previous</button>
      <button class="control primary" id="nextBtn">${pos===order.length-1?'Finish':'Next'}</button>
    </div></div>`;
  document.getElementById('quiz').innerHTML = html;

  document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>answer(Number(btn.dataset.i))));
  document.getElementById('prevBtn').onclick = ()=>{ if(pos>0){pos--;render();} };
  document.getElementById('nextBtn').onclick = ()=>{ if(pos<order.length-1){pos++;render();} else renderSummary(); };
  renderNav();
}

function answer(i){
  const q = QUESTIONS[order[pos]];
  if(selected.has(q.id)) return;
  selected.set(q.id,i);
  answered.add(q.id);
  if(i===q.a) score++;
  render();
}

function renderSummary(){
  document.getElementById('counter').textContent = "Complete";
  document.getElementById('progress').style.width = "100%";
  const pct = Math.round(score/order.length*100);
  document.getElementById('quiz').innerHTML = `<div class="card summary">
    <div class="meta">ITIL V5 Foundation · 78 questions</div>
    <h2>Quiz complete</h2>
    <div class="score">${score} / ${order.length}</div>
    <div class="small">${pct}% correct</div>
    <div class="controls">
      <button class="control" onclick="reviewWrong()">Review incorrect</button>
      <button class="control primary" onclick="restart()">Restart quiz</button>
    </div>
  </div>`;
  document.getElementById('navigator').style.display='none';
}

function reviewWrong(){
  const wrong = order.filter(i=>selected.get(QUESTIONS[i].id)!==QUESTIONS[i].a);
  if(!wrong.length){alert("No incorrect answers — excellent!");return;}
  order = wrong;
  pos=0;
  render();
}

function restart(){
  order = QUESTIONS.map((_,i)=>i);
  pos=0; selected.clear(); answered.clear(); score=0;
  render();
}

function shuffle(){
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  pos=0;
  render();
}

function renderNav(){
  const nav = document.getElementById('navigator');
  if(nav.style.display==='none') return;
  nav.innerHTML = order.map((idx,i)=>{
    const q=QUESTIONS[idx];
    const cls = `${i===pos?'current ':''}${selected.has(q.id)?'done':''}`;
    return `<button class="${cls}" onclick="pos=${i};render()">${i+1}</button>`;
  }).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('shuffleBtn').onclick = shuffle;
document.getElementById('restartBtn').onclick = restart;
document.getElementById('navBtn').onclick = ()=>{
  const n=document.getElementById('navigator');
  n.style.display=n.style.display==='none'?'grid':'none';
  renderNav();
};
render();
</script>
</body>
</html>
